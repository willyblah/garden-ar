<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拙政园 · 画中游</title>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<style>
  :root{ --paper:#F5F0E6; --ink:#2C2416; --ink-soft:#5a4d3a; --seal:#B73A2A; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#000;
    font-family:'Songti SC','STSong','Noto Serif SC',serif; color:var(--ink);
    -webkit-user-select:none; user-select:none; }
  body.preview{ background:radial-gradient(ellipse at 50% 40%, #4a4034, #1e1a15 75%); }
  #app{ position:fixed; inset:0; overflow:hidden; }

  .card{ background:rgba(245,240,230,.93); box-shadow:0 4px 16px rgba(0,0,0,.28); }
  button{ font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }

  .hint{
    position:fixed; left:50%; top:calc(24px + env(safe-area-inset-top)); transform:translateX(-50%); z-index:10;
    padding:10px 20px; border-radius:22px; font-size:16px; letter-spacing:.12em; white-space:nowrap;
    transition:opacity .4s;
  }
  .hint.hide{ opacity:0; pointer-events:none; }

  #panel{
    position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:10;
    max-width:460px; margin:0 auto; padding:14px 18px 16px; border-radius:16px; box-sizing:border-box;
  }
  .row{ display:flex; align-items:center; gap:10px; }
  #shichen{ font-size:19px; font-weight:600; letter-spacing:.12em; }
  #clock{ font-size:16px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  #now{ margin-left:auto; }

  #hour{ -webkit-appearance:none; appearance:none; width:100%; height:32px; margin:6px 0 8px; background:transparent; }
  #hour::-webkit-slider-runnable-track{ height:6px; border-radius:3px;
    background:linear-gradient(90deg,#27304f,#27304f 16%,#e8b8a8 26%,#f3e6c4 45%,#f3e6c4 62%,#e08a4a 76%,#4a4a6e 84%,#27304f); }
  #hour::-moz-range-track{ height:6px; border-radius:3px;
    background:linear-gradient(90deg,#27304f,#27304f 16%,#e8b8a8 26%,#f3e6c4 45%,#f3e6c4 62%,#e08a4a 76%,#4a4a6e 84%,#27304f); }
  #hour::-webkit-slider-thumb{ -webkit-appearance:none; width:24px; height:24px; margin-top:-9px; border-radius:50%;
    background:var(--seal); border:3px solid var(--paper); box-shadow:0 1px 4px rgba(0,0,0,.35); }
  #hour::-moz-range-thumb{ width:18px; height:18px; border-radius:50%;
    background:var(--seal); border:3px solid var(--paper); box-shadow:0 1px 4px rgba(0,0,0,.35); }

  .pill{ border:1px solid rgba(44,36,22,.35); background:transparent; border-radius:18px;
    padding:5px 14px; font-size:16px; letter-spacing:.1em; }
  .pill.on{ background:var(--seal); border-color:var(--seal); color:var(--paper); }
  #seasons{ display:flex; gap:10px; }
  #seasons button{ flex:1; }

  #picker{
    position:fixed; left:50%; top:calc(20px + env(safe-area-inset-top)); transform:translateX(-50%); z-index:10;
    display:none; gap:8px; padding:8px; border-radius:24px;
  }
  body.preview #picker{ display:flex; }
  #picker button{ width:40px; height:40px; padding:0; border-radius:50%; }

  #diag{
    position:fixed; inset:0; z-index:30; display:none;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(245,240,230,.97); text-align:center;
    font-size:16px; line-height:1.9; letter-spacing:.05em;
  }
  #diag.show{ display:flex; }
  #diag .box{ max-width:420px; }
  #diag h3{ color:var(--seal); margin:0 0 10px; font-size:20px; letter-spacing:.15em; }
  #diag code{ background:#e8e0cb; padding:1px 6px; border-radius:3px; font-size:14px; }
  #diagPreview{ margin-top:18px; }
</style>
</head>
<body>

<div id="app"></div>
<div class="hint card" id="hint">将摄像头对准古画</div>
<div id="picker" class="card"></div>

<div id="panel" class="card">
  <div class="row">
    <span id="shichen"></span><span id="clock"></span>
    <button type="button" id="now" class="pill">此刻</button>
  </div>
  <input type="range" id="hour" min="0" max="24" step="0.25" aria-label="时间">
  <div id="seasons"></div>
</div>

<div id="diag"><div class="box">
  <h3 id="diagTitle"></h3>
  <div id="diagMsg"></div>
  <button type="button" id="diagPreview" class="pill">不用相机，直接观看</button>
</div></div>

<script>
  if (location.protocol === 'file:') {
    document.body.innerHTML = '<div style="padding:40px 24px;text-align:center;line-height:2;font-size:16px;background:#F5F0E6;height:100%">'
      + '请不要直接双击打开。<br>在项目文件夹里运行 python3 -m http.server，再访问 http://localhost:8000</div>';
  }
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
